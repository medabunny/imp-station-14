- type: entity
  parent: BaseMidRoundAntag
  id: ButlerSpawn
  components:
  - type: StationEvent
    weight: 1.5
  - type: AntagLoadProfileRule
  - type: AntagObjectives
    objectives:
    - ButlerServeObjective
    - ButlerDieObjective
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointGhostButler
      min: 1
      max: 1
      pickPlayer: false
      startingGear: ButlerGear
      roleLoadout:
      - RoleSurvivalStandard
      components:
      - type: RandomHumanoidAppearance
      - type: AutoImplant
        implants:
        - ButlerBombImplant
      - type: UnableToWield
      - type: NpcFactionMember
        factions:
        - Passive
      mindRoles:
      - MindRoleButler

