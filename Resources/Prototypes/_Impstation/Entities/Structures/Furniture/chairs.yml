- type: entity
  name: apid seat
  id: ChairApid
  parent: StoolBase
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Furniture/Chairs/chair_apid.rsi
    state: apid
  - type: Construction
    graph: ImpSeat
    node: chairapid

# TODO: this needs to be able to crumple if you're too heavy when you buckle into it. there's already a sprite for it in the rsi.
- type: entity
  name: cardboard chair
  id: ChairCardboard
  parent: ChairBase
  description: You can try to sit on it. You're not sure it'll go well.
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Furniture/cardboard_chair.rsi
    state: chair
  - type: Damageable
    damageModifierSet: Card
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCardboard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Construction
    graph: ImpSeat
    node: chairCardboard

- type: entity
  name: invisible chair
  description: The mime needs to sit down and shut up.
  id: ChairMime
  parent: SeatBase
  components:
  - type: Sprite
    state: chair
  - type: Stealth
    useAltShader: true
    lastVisibility: -1
  - type: TriggerOnUnstrapped
  - type: DeleteOnTrigger
  - type: StaticPrice
    price: 0

- type: entity
  name: big log
  id: ChairBigLog
  parent: SeatBase
  description: A big log. You could sit on it, or gnaw on it if you're a beaver or some kind of termite person.
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _Impstation/Structures/Furniture/Chairs/log_big.rsi
    state: full
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 35
  - type: Construction
    graph: chairBigLog
    node: chairbiglog
